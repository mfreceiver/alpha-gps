横屏）</text><text x="452" y="294" font-size="10.5" font-weight="600" fill="#0B57D0" text-anchor="start" >高 &lt; 480dp</text><text x="452" y="310" font-size="10.5" font-weight="400" fill="#42474E" text-anchor="start" >一行排完：信息条 | 胶片条 | 圆形下载</text><text x="452" y="324" font-size="10.5" font-weight="400" fill="#42474E" text-anchor="start" >顶栏改为透明叠在照片上，单击照片全部隐藏</text><text x="452" y="338" font-size="10.5" font-weight="400" fill="#42474E" text-anchor="start" >详情 = 右侧面板（宽 360dp）</text><text x="452" y="40" font-size="12" font-weight="700" fill="#191C20" text-anchor="start" >三种窗口形状 · 同一组三个部件</text><text x="452" y="58" font-size="10.5" font-weight="400" fill="#42474E" text-anchor="start" >只换位置，不换样式；都半透明、可与照片交叠</text></svg>