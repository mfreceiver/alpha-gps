24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" transform="translate(212,644) scale(0.6667)" fill="#49454F"/><text x="24" y="696" font-size="11" font-weight="500" fill="#8A5A00" text-anchor="start" >未检测到存储卡（相机无法浏览照片）</text><g opacity="1"><rect x="294" y="672" width="22" height="11" rx="2" fill="none" stroke="#49454F" stroke-width="1.4" /><rect x="317" y="675" width="2" height="5" rx="1" fill="#49454F" /><rect x="296" y="674" width="14.76" height="7" rx="1" fill="#2E7D32" /></g><text x="324" y="682" font-size="13" font-weight="600" fill="#1D1B20" text-anchor="start" >82%</text><text x="392" y="648" font-size="12" font-weight="400" fill="#49454F" text-anchor="start" >新机型仅浏览卡槽 1：无卡时显示「无卡」+说明；与现</text><text x="392" y="665" font-size="12" font-weight="400" fill="#49454F" text-anchor="start" >有「没有支持的照片」空态并存。</text></svg>