<svg xmlns="http://www.w3.org/2000/svg" width="740.0" height="744.0" viewBox="0 0 740 744" font-family="'Source Han Sans CN','Noto Sans CJK SC','Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B5566"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E5322D"/></marker></defs><rect width="740" height="744" fill="#FFFFFF"/><text x="10" y="24" font-size="13" font-weight="600" fill="#6750A4" text-anchor="start" >正常（默认）</text><rect x="10" y="32" width="358" height="94" rx="12" fill="#F3EDF7" /><text x="24" y="54" font-size="11" font-weight="400" fill="#49454F" text-anchor="start" >固件版本</text><text x="136" y="54" font-size="11" font-weight="400" fill="#49454F" text-anchor="start" >序列号</text><text x="256" y="54" font-size="11" font-weight="400" fill="#49454F" text-anchor="start" >存储卡 1</text><text x="24" y="74" font-size="14" font-weight="600" fill="#1D1B20" text-anchor="start" >2.00</text><text x="136" y="74" font-size="14" font-weight="600" fill="#1D1B20" text-anchor="start" >•••3456</text><text x="256" y="74" font-size="14" font-weight="600" fill="#1D1B20" text-anchor="start" >128 GB</text><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" transform="translate(212,60) scale(0.6667)" fill="#49454F"/><rect x="24" y="88" width="220" height="6" rx="3" fill="#CAC4D0" /><rect x="24" y="88" width="92.8125" height="6" rx="3" fill="#6750A4" /><text x="24" y="112" font-size="11" font-weight="400" fill="#49454F" text-anchor="start" >已用 54 GB · 可用 74 GB</text><g opacity="1"><rect x="294" y="88" width="22" height="11" rx="2" fill="none" stroke="#49454F" stroke-width="1.4" /><r