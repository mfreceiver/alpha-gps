/text><text x="256" y="346" font-size="11" font-weight="400" fill="#49454F" text-anchor="start" >存储卡 1</text><text x="24" y="366" font-size="14" font-weight="600" fill="#79747E" text-anchor="start" >—</text><text x="136" y="366" font-size="14" font-weight="600" fill="#79747E" text-anchor="start" >不可用</text><text x="256" y="366" font-size="14" font-weight="600" fill="#1D1B20" text-anchor="start" >128 GB</text><text x="24" y="404" font-size="11" font-weight="400" fill="#49454F" text-anchor="start" >可用空间未知</text><g opacity="1"><rect x="294" y="380" width="22" height="11" rx="2" fill="none" stroke="#49454F" stroke-width="1.4" /><rect x="317" y="383" width="2" height="5" rx="1" fill="#49454F" /><text x="305.0" y="389" font-size="9" font-weight="700" fill="#49454F" text-anchor="middle" >?</text></g><text x="324" y="390" font-size="13" font-weight="600" fill="#79747E" text-anchor="start" >—</text><text x="392" y="356" font-size="12" font-weight="400" fill="#49454F" text-anchor="start" >固件/序列号读取失败或相机未返回：显示「—」「不可用</text><text x="392" y="373" font-size="12" font-weight="400" fill="#49454F" text-anchor="start" >」，不影响照片浏览；可用空间未知时不画进度条。</text><text x="10" y="462" font-size="13" font-weight="600" fill="#6750A4" text-anchor="start" >序列号已展开</text><rect x="10" y="470" width="358" height="94" rx="12" fill="#F3EDF7" /><text x="24" y="492" font-size="11" font-weight="400" fill="#49454F" text-anchor="start" >固件版本</text><text x="136" y="492" font-size="11" font-weight="400" fill="#49454F" text-anchor="start" >序列号</text><text x="256" y="492" font-size="11" font-weight="400" fill="#49454F" text-anchor="start" >存储卡 1</text><text x="24" y="512" font-size="14" font-weight="600" fill="#1D1B20" text-anchor="start" >2.00</text><text x="136" y="512" font-size="14" font-weight="600" fill="#1D1B20" text-anchor="start" >5012345678</text><text x="256" y="512" font-size="14" font-weight="600" fill="#1D1B20" text-anchor="start" >128 GB</text><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s