<svg xmlns="http://www.w3.org/2000/svg" width="1340.0" height="640.0" viewBox="0 0 1340 640" font-family="'Source Han Sans CN','Noto Sans CJK SC','Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B5566"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E5322D"/></marker></defs><rect width="1340" height="640" fill="#FFFFFF"/><text x="10" y="22" font-size="15" font-weight="600" fill="#6750A4" text-anchor="start" >A. 时间校正状态 TimeSyncStatus（新增）</text><rect x="10" y="150" width="110" height="40" rx="20" fill="#F1ECF4" stroke="#79747E" stroke-width="1.5" /><text x="65.0" y="168" font-size="13" font-weight="600" fill="#79747E" text-anchor="middle" >未开始</text><text x="65.0" y="182" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="middle" >断开/握手前</text><rect x="190" y="150" width="110" height="40" rx="20" fill="#FFF4D1" stroke="#8A5A00" stroke-width="1.5" /><text x="245.0" y="168" font-size="13" font-weight="600" fill="#8A5A00" text-anchor="middle" >校时中</text><text x="245.0" y="182" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="middle" >Syncing</text><rect x="400" y="50" width="140" height="40" rx="20" fill="#E3F4E4" stroke="#2E7D32" stroke-width="1.5" /><text x="470.0" y="68" font-size="13" font-weight="600" fill="#2E7D32" text-anchor="middle" >已校正</text><text x="470.0" y="82" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="middle" >Applied(at)</text><rect x="400" y="112" width="140" height="40" rx="20" fill="#FFF4D1" stroke="#8A5A00" stroke-width="1.5" /><text x="470.0" y="130" font-size="13" font-weight="600" fill="#8A5A00" text-anchor="middle" >被相机拒绝</text><text x="470.0" y="144" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="middle" >Rejected(reason)</text><rect x="400" y="174" width="140" height="40" rx="20" fill="#FFF4D1" stroke="#8A5A00" stroke-width="1.5" /><text x="470.0" y="192" font-size="13" font-weight="600" fill="#8A5A00" text-anchor="middle" >校时未确认</text><text x="470.0" y="206" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="middle" >Unconfirmed</text><rect x="400" y="236" width="140" height="40" rx="20" fill="#FCE4E2" stroke="#B3261E" stroke-width="1.5" /><text x="470.0" y="254" font-size="13" font-weight="600" fill="#B3261E" text-anchor="middle" >写入失败</text><text x="470.0" y="268" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="middle" >WriteFailed</text><rect x="190" y="236" width="110" height="40" rx="20" fill="#F1ECF4" stroke="#79747E" stroke-width="1.5" /><text x="245.0" y="254" font-size="13" font-weight="600" fill="#79747E" text-anchor="middle" >不支持</text><text x="245.0" y="268" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="middle" >CC0D 声明</text><line x1="120" y1="170" x2="188" y2="170" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><text x="155" y="160" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="middle" >握手</text><line x1="300" y1="160" x2="398" y2="72" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><text x="305" y="108" font-size="10.5" font-weight="400" fill="#2E7D32" text-anchor="start" >CC0E applied=1</text><line x1="300" y1="164" x2="398" y2="132" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><text x="318" y="140" font-size="10.5" font-weight="400" fill="#8A5A00" text-anchor="start" >applied=0</text><line x1="300" y1="176" x2="398" y2="194" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><text x="318" y="200" font-size="10.5" font-weight="400" fill="#8A5A00" text-anchor="start" >30 s 无回执</text><line x1="290" y1="190" x2="398" y2="256" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><text x="308" y="232" font-size="10.5" font-weight="400" fill="#B3261E" text-anchor="start" >CC13 写失败</text><line x1="245" y1="190" x2="245" y2="234" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><text x="255" y="214" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="start" >CC0D=不支持</text><path d="M470 50 C470 36 250 36 250 148" fill="none" stroke="#5B5566" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="360" y="44" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="middle" >tz/DST 偏移变化 → 重新 Syncing（结果出来前保留上次状态）</text><text x="10" y="300" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >规则：只有相机回执 applied=1 才算「已校正」；写成功但无回执 = 「未确认」（与「校时不阻塞 GPS」一致）。</text><text x="10" y="318" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >断开/重连：状态复位为未开始；任何终态都不会让设备页误显示「已校正」。</text><text x="700" y="22" font-size="15" font-weight="600" fill="#6750A4" text-anchor="start" >B. GPS 写入新鲜度（距最近一次「已写入」确认）</text><rect x="700.0" y="60" width="108.0" height="26" rx="0" fill="#2E7D32" opacity="0.85" /><text x="754.0" y="78" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" >传输中</text><rect x="808.0" y="60" width="324.0" height="26" rx="0" fill="#F9A825" opacity="0.85" /><text x="970.0" y="78" font-size="12" font-weight="600" fill="#3b2a00" text-anchor="middle" >写入延迟</text><rect x="1132.0" y="60" width="216.0" height="26" rx="0" fill="#B3261E" opacity="0.85" /><text x="1240.0" y="78" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" >写入中断</text><line x1="700.0" y1="86" x2="700.0" y2="94" stroke="#5B5566" stroke-width="1" /><text x="700.0" y="108" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="middle" >0s</text><line x1="736.0" y1="86" x2="736.0" y2="94" stroke="#5B5566" stroke-width="1" /><text x="736.0" y="108" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="middle" >5s</text><line x1="772.0" y1="86" x2="772.0" y2="94" stroke="#5B5566" stroke-width="1" /><text x="772.0" y="108" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="middle" >10s</text><line x1="808.0" y1="86" x2="808.0" y2="94" stroke="#5B5566" stroke-width="1" /><text x="808.0" y="108" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="middle" >15s</text><line x1="916.0" y1="86" x2="916.0" y2="94" stroke="#5B5566" stroke-width="1" /><text x="916.0" y="108" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="middle" >30s</text><line x1="1132.0" y1="86" x2="1132.0" y2="94" stroke="#5B5566" stroke-width="1" /><text x="1132.0" y="108" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="middle" >60s</text><line x1="1348.0" y1="86" x2="1348.0" y2="94" stroke="#5B5566" stroke-width="1" /><text x="1348.0" y="108" font-size="10.5" font-weight="400" fill="#49454F" text-anchor="middle" >90s</text><text x="700" y="134" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >上传周期 5 s（LOCATION_UPDATE_INTERVAL_MS）→ 15 s = 连续 3 个周期无确认；阈值为设计建议，可调。</text><text x="700" y="156" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >灰色「已停止」：会话非 Transmitting（未连接/握手中），不套用此色阶。</text><text x="700" y="184" font-size="13" font-weight="600" fill="#1D1B20" text-anchor="start" >原因提示优先级（只显示最高一条）：</text><text x="708" y="206" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >1. 相机提示位置传输已关闭（locationDisabledByCamera，已有）</text><text x="708" y="225" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >2. 手机暂无定位（LocationSource 无 fix / 定位权限）</text><text x="708" y="244" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >3. 已传输 − 已写入 差值持续增大：蓝牙拥塞/队列取消</text><text x="708" y="263" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >4. 其它：显示「已 N 秒未收到相机确认」</text><text x="700" y="296" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >已传输 = sendToDevice 入队成功；已写入 = GATT 写完成回调 Success。</text><text x="700" y="314" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >失败/取消 = Failure / Timeout / Cancelled / NotInitiated（仅在 Ⓘ 明细显示）。</text><text x="10" y="380" font-size="15" font-weight="600" fill="#6750A4" text-anchor="start" >C. 蓝牙信号 RSSI 分档与轮询</text><g opacity="1"><rect x="14" y="419" width="4" height="5" rx="1" fill="#2E7D32" /><rect x="20" y="415" width="4" height="9" rx="1" fill="#2E7D32" /><rect x="26" y="411" width="4" height="13" rx="1" fill="#2E7D32" /><rect x="32" y="407" width="4" height="17" rx="1" fill="#2E7D32" /></g><text x="50" y="421" font-size="13" font-weight="500" fill="#1D1B20" text-anchor="start" >≥ −60 dBm</text><text x="190" y="421" font-size="13" font-weight="600" fill="#2E7D32" text-anchor="start" >强</text><g opacity="1"><rect x="14" y="453" width="4" height="5" rx="1" fill="#2E7D32" /><rect x="20" y="449" width="4" height="9" rx="1" fill="#2E7D32" /><rect x="26" y="445" width="4" height="13" rx="1" fill="#2E7D32" /><rect x="32" y="441" width="4" height="17" rx="1" fill="#CAC4D0" /></g><text x="50" y="455" font-size="13" font-weight="500" fill="#1D1B20" text-anchor="start" >−60 ~ −75</text><text x="190" y="455" font-size="13" font-weight="600" fill="#2E7D32" text-anchor="start" >良好</text><g opacity="1"><rect x="14" y="487" width="4" height="5" rx="1" fill="#F9A825" /><rect x="20" y="483" width="4" height="9" rx="1" fill="#F9A825" /><rect x="26" y="479" width="4" height="13" rx="1" fill="#CAC4D0" /><rect x="32" y="475" width="4" height="17" rx="1" fill="#CAC4D0" /></g><text x="50" y="489" font-size="13" font-weight="500" fill="#1D1B20" text-anchor="start" >−75 ~ −85</text><text x="190" y="489" font-size="13" font-weight="600" fill="#F9A825" text-anchor="start" >一般</text><g opacity="1"><rect x="14" y="521" width="4" height="5" rx="1" fill="#B3261E" /><rect x="20" y="517" width="4" height="9" rx="1" fill="#CAC4D0" /><rect x="26" y="513" width="4" height="13" rx="1" fill="#CAC4D0" /><rect x="32" y="509" width="4" height="17" rx="1" fill="#CAC4D0" /></g><text x="50" y="523" font-size="13" font-weight="500" fill="#1D1B20" text-anchor="start" >&lt; −85</text><text x="190" y="523" font-size="13" font-weight="600" fill="#B3261E" text-anchor="start" >弱</text><g opacity="1"><rect x="14" y="555" width="4" height="5" rx="1" fill="#CAC4D0" /><rect x="20" y="551" width="4" height="9" rx="1" fill="#CAC4D0" /><rect x="26" y="547" width="4" height="13" rx="1" fill="#CAC4D0" /><rect x="32" y="543" width="4" height="17" rx="1" fill="#CAC4D0" /></g><text x="50" y="557" font-size="13" font-weight="500" fill="#1D1B20" text-anchor="start" >读取失败/未连接</text><text x="190" y="557" font-size="13" font-weight="600" fill="#79747E" text-anchor="start" >—</text><text x="250" y="420" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >• 页面可见 + 已连接：进入时读 1 次，之后每 5 s（与 GPS 周期对齐）</text><text x="250" y="444" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >• 页面不可见 / 应用后台 / 断开：立即停止，不后台轮询（省电）</text><text x="250" y="468" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >• 读取失败：保留上次值最长 15 s，之后显示「—」，不显示陈旧值</text><text x="250" y="492" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >• 分档阈值为设计建议，实机标定后可调（待核实 α 系列实际范围）</text><text x="250" y="516" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >• RSSI 读取是否占 GATT 队列：待实现时核实，须让位于位置写入</text><text x="700" y="380" font-size="15" font-weight="600" fill="#6750A4" text-anchor="start" >D. 电池缓存新鲜度</text><rect x="700" y="404" width="120" height="26" rx="0" fill="#2E7D32" opacity="0.9" /><text x="760.0" y="422" font-size="11" font-weight="600" fill="#fff" text-anchor="middle" >≤ 30 分钟：正常显示</text><rect x="820" y="404" width="280" height="26" rx="0" fill="#79747E" opacity="0.9" /><text x="960.0" y="422" font-size="11" font-weight="600" fill="#fff" text-anchor="middle" >30 分钟~24 小时：灰色 + 获取时间</text><rect x="1100" y="404" width="130" height="26" rx="0" fill="#BDB6C4" opacity="0.9" /><text x="1165.0" y="422" font-size="11" font-weight="600" fill="#222" text-anchor="middle" >&gt; 24 小时/换机：「—」</text><text x="700" y="456" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >• 获取时机仅限 Wi-Fi/PTP 会话（Ready 后 1 次，点「刷新」再读 1 次）</text><text x="700" y="478" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >• 缓存键 = cameraId（MAC）；仅应用进程内，不写数据库</text><text x="700" y="500" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >• 电量 ≤ 20% 红色并改称「电池电量低」；≤ 10% 同色加粗</text><text x="700" y="522" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >• 备选（待核实）：相机 BLE 若暴露标准 Battery Service 0x180F，</text><text x="700" y="544" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >  可在 BLE 期间直接读取，此时「上次获取」标注可省略</text></svg>