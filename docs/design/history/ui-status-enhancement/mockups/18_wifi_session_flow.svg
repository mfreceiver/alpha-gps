<svg xmlns="http://www.w3.org/2000/svg" width="1340.0" height="756.0" viewBox="0 0 1340 756" font-family="'Source Han Sans CN','Noto Sans CJK SC','Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B5566"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E5322D"/></marker></defs><rect width="1340" height="756" fill="#FFFFFF"/><rect x="10" y="8" width="480" height="28" rx="6" fill="#6750A4" /><text x="250" y="27" font-size="13" font-weight="600" fill="#fff" text-anchor="middle" >协议 / 会话步骤</text><rect x="520" y="8" width="400" height="28" rx="6" fill="#6750A4" /><text x="720" y="27" font-size="13" font-weight="600" fill="#fff" text-anchor="middle" >内部动作</text><rect x="950" y="8" width="380" height="28" rx="6" fill="#6750A4" /><text x="1140" y="27" font-size="13" font-weight="600" fill="#fff" text-anchor="middle" >用户看到的界面</text><rect x="10" y="46" width="480" height="56" rx="8" fill="#E3F4E4" stroke="#2E7D32" stroke-width="1.2" /><text x="20" y="78.55" font-size="13" font-weight="600" fill="#1D1B20" text-anchor="start" >1. 点击「Wi-Fi 照片传输」</text><rect x="520" y="46" width="400" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="530" y="78.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >进入 Wi-Fi 页（现有）</text><rect x="950" y="46" width="380" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="960" y="78.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >信息条不显示</text><line x1="490" y1="74" x2="518" y2="74" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="920" y1="74" x2="948" y2="74" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="250" y1="102" x2="250" y2="116" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="116" width="480" height="56" rx="8" fill="#E3F4E4" stroke="#2E7D32" stroke-width="1.2" /><text x="20" y="148.55" font-size="13" font-weight="600" fill="#1D1B20" text-anchor="start" >2. BLE 启动相机 Wi-Fi → 加入网络</text><rect x="520" y="116" width="400" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="530" y="148.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >PreparingCamera → JoiningNetwork（现有）</text><rect x="950" y="116" width="380" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="960" y="148.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >沿用现有进度/失败页</text><line x1="490" y1="144" x2="518" y2="144" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="920" y1="144" x2="948" y2="144" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="250" y1="172" x2="250" y2="186" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="186" width="480" height="56" rx="8" fill="#EFE3F7" stroke="#7B3FA0" stroke-width="1.2" /><text x="20" y="218.55" font-size="13" font-weight="600" fill="#1D1B20" text-anchor="start" >3. OpenSession → GetDeviceInfo 0x1001</text><rect x="520" y="186" width="400" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="530" y="218.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >OpeningSession → Ready</text><rect x="950" y="186" width="380" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="960" y="218.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >固件、序列号入内存（解析即得，无额外请求）</text><line x1="490" y1="214" x2="518" y2="214" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="920" y1="214" x2="948" y2="214" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="250" y1="242" x2="250" y2="256" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="256" width="480" height="56" rx="8" fill="#EFE3F7" stroke="#7B3FA0" stroke-width="1.2" /><text x="20" y="288.55" font-size="13" font-weight="600" fill="#1D1B20" text-anchor="start" >4. 枚举目录（第 1 页先出）</text><rect x="520" y="256" width="400" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="530" y="288.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >browseDates / browsePhotos（现有）</text><rect x="950" y="256" width="380" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="960" y="288.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >缩略图出现；保护/评分随记录入内存；开关可用</text><line x1="490" y1="284" x2="518" y2="284" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="920" y1="284" x2="948" y2="284" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="250" y1="312" x2="250" y2="326" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="326" width="480" height="56" rx="8" fill="#FFEBD5" stroke="#C25E00" stroke-width="1.2" /><text x="20" y="358.55" font-size="13" font-weight="600" fill="#1D1B20" text-anchor="start" >5. GetStorageInfo 0x1005（卡槽 1）</text><rect x="520" y="326" width="400" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="530" y="358.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >目录首屏返回后再发，不拖慢首屏</text><rect x="950" y="326" width="380" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="960" y="358.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >「存储卡」「可用/已用」进度条出现</text><line x1="490" y1="354" x2="518" y2="354" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="920" y1="354" x2="948" y2="354" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="250" y1="382" x2="250" y2="396" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="396" width="480" height="56" rx="8" fill="#FFEBD5" stroke="#C25E00" stroke-width="1.2" /><text x="20" y="428.55" font-size="13" font-weight="600" fill="#1D1B20" text-anchor="start" >6. 读电量 0x5001 / 0xD218</text><rect x="520" y="396" width="400" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="530" y="428.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >同一小批请求，失败只影响本项</text><rect x="950" y="396" width="380" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="960" y="428.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >电量 chip 出现；写入设备页缓存</text><line x1="490" y1="424" x2="518" y2="424" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="920" y1="424" x2="948" y2="424" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="250" y1="452" x2="250" y2="466" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="466" width="480" height="56" rx="8" fill="#E3F4E4" stroke="#2E7D32" stroke-width="1.2" /><text x="20" y="498.55" font-size="13" font-weight="600" fill="#1D1B20" text-anchor="start" >7. 用户点右上角开关</text><rect x="520" y="466" width="400" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="530" y="498.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >纯本地，不发请求</text><rect x="950" y="466" width="380" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="960" y="498.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >角标即时显隐 + 偏好记忆</text><line x1="490" y1="494" x2="518" y2="494" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="920" y1="494" x2="948" y2="494" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="250" y1="522" x2="250" y2="536" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="536" width="480" height="56" rx="8" fill="#FFEBD5" stroke="#C25E00" stroke-width="1.2" /><text x="20" y="568.55" font-size="13" font-weight="600" fill="#1D1B20" text-anchor="start" >8. 用户点「刷新」</text><rect x="520" y="536" width="400" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="530" y="568.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >重枚举目录 + GetStorageInfo + 电量</text><rect x="950" y="536" width="380" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="960" y="568.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >角标/容量/电量更新；信息条骨架不重现（保留旧值）</text><line x1="490" y1="564" x2="518" y2="564" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="920" y1="564" x2="948" y2="564" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="250" y1="592" x2="250" y2="606" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="606" width="480" height="56" rx="8" fill="#E3F4E4" stroke="#2E7D32" stroke-width="1.2" /><text x="20" y="638.55" font-size="13" font-weight="600" fill="#1D1B20" text-anchor="start" >9. 断开 / 会话结束</text><rect x="520" y="606" width="400" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="530" y="638.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >Closing → Idle</text><rect x="950" y="606" width="380" height="56" rx="8" fill="#FAF7FC" stroke="#CAC4D0" stroke-width="1.2" /><text x="960" y="638.2" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >信息条消失；固件/序列号清除；电量缓存保留</text><line x1="490" y1="634" x2="518" y2="634" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><line x1="920" y1="634" x2="948" y2="634" stroke="#5B5566" stroke-width="1.6" marker-end="url(#ah)"/><rect x="10" y="678" width="1320" height="64" rx="8" fill="#FFF4D1" stroke="#C9A227" stroke-width="1.2" /><text x="24" y="702" font-size="13" font-weight="600" fill="#8A5A00" text-anchor="start" >失败原则：每项独立。GetDeviceInfo/GetStorageInfo/电量/评分任一失败 → 该项显示「—」或「不可用」，</text><text x="24" y="724" font-size="12" font-weight="400" fill="#1D1B20" text-anchor="start" >不弹错误、不阻塞照片浏览与下载；用户点「刷新」可重试。PTP 事务本就串行，信息类请求排在首屏之后，不影响首屏速度。</text></svg>