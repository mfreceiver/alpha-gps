<svg xmlns="http://www.w3.org/2000/svg" width="1330.0" height="330.0" viewBox="0 0 1330 330" font-family="'Source Han Sans CN','Noto Sans CJK SC','Noto Sans CJK JP',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B5566"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E5322D"/></marker></defs><rect x="0" y="0" width="1330" height="330" rx="0" fill="#FFFFFF" /><text x="14" y="26" font-size="14" font-weight="700" fill="#BA1A1A" text-anchor="start" >现状：日期内按 PAGE_SIZE=60 切页（227 张 → 4 页）</text><rect x="14" y="44" width="300.0" height="70" rx="8" fill="#EDF1F7" stroke="#C2C7CF" stroke-width="1.2" /><text x="164.0" y="74" font-size="14" font-weight="600" fill="#191C20" text-anchor="middle" >第 1 页</text><text x="164.0" y="96" font-size="11.5" font-weight="400" fill="#42474E" text-anchor="middle" >60 张 · 一次只渲染这一页</text><rect x="324.0" y="44" width="300.0" height="70" rx="8" fill="#EDF1F7" stroke="#C2C7CF" stroke-width="1.2" /><text x="474.0" y="74" font-size="14" font-weight="600" fill="#191C20" text-anchor="middle" >第 2 页</text><text x="474.0" y="96" font-size="11.5" font-weight="400" fill="#42474E" text-anchor="middle" >60 张 · 一次只渲染这一页</text><rect x="634.0" y="44" width="300.0" height="70" rx="8" fill="#EDF1F7" stroke="#C2C7CF" stroke-width="1.2" /><text x="784.0" y="74" font-size="14" font-weight="600" fill="#191C20" text-anchor="middle" >第 3 页</text><text x="784.0" y="96" font-size="11.5" font-weight="400" fill="#42474E" text-anchor="middle" >60 张 · 一次只渲染这一页</text><rect x="944.0" y="44" width="235.0" height="70" rx="8" fill="#EDF1F7" stroke="#C2C7CF" stroke-width="1.2" /><text x="1061.5" y="74" font-size="14" font-weight="600" fill="#191C20" text-anchor="middle" >第 4 页</text><text x="1061.5" y="96" font-size="11.5" font-weight="400" fill="#42474E" text-anchor="middle" >47 张 · 一次只渲染这一页</text><rect x="14" y="126" width="1000" height="30" rx="15" fill="#D8E3F8" /><text x="514" y="146" font-size="13" font-weight="600" fill="#111C2B" text-anchor="middle" >‹  第 1 / 4 页  ›   ← 底部分页栏（要取消）</text><text x="14" y="182" font-size="12" font-weight="400" fill="#42474E" text-anchor="start" >代价/连带：选择需跨页(map)、全选只限本页、拖选限本页(PageIdentity)、预览翻到边界要加载邻页(changingPage 锁滑动)</text><text x="14" y="220" font-size="14" font-weight="700" fill="#1B6E3A" text-anchor="start" >v2：日期内一个连续网格（LazyVerticalGrid 全量 227 项；缩略图仍只按可见窗口加载）</text><rect x="14" y="236" width="1000" height="70" rx="8" fill="#D3E3FD" stroke="#0B57D0" stroke-width="1.5" /><text x="514" y="262" font-size="14" font-weight="600" fill="#041E49" text-anchor="middle" >227 张 · 连续滚动 · 右侧快速滚动条</text><rect x="430" y="270" width="170" height="26" rx="6" fill="none" stroke="#0B57D0" stroke-width="2" stroke-dasharray="5 3"/><text x="515" y="288" font-size="11.5" font-weight="600" fill="#0B57D0" text-anchor="middle" >可见窗口 + 前后余量 → 请求缩略图</text><text x="1030" y="262" font-size="12.5" font-weight="400" fill="#191C20" text-anchor="start" >目录本来就整日常驻内存</text><text x="1030" y="282" font-size="12.5" font-weight="400" fill="#191C20" text-anchor="start" >（CatalogSnapshot.byDate），</text><text x="1030" y="302" font-size="12.5" font-weight="400" fill="#191C20" text-anchor="start" >分页只是 UI 切片 → 取消零相机流量增量</text></svg>