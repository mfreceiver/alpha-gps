 · 2 列</text><text x="408.3" y="279.0" font-size="11.5" font-weight="400" fill="#42474E" text-anchor="middle" >187.0 dp 方块</text><text x="700" y="56" font-size="14" font-weight="700" fill="#191C20" text-anchor="start" >角标位置（四角固定，信息不抢画面）</text><text x="700" y="84" font-size="12.5" font-weight="600" fill="#0B57D0" text-anchor="start" >左上</text><text x="800" y="84" font-size="12.5" font-weight="400" fill="#191C20" text-anchor="start" >放大镜（快速预览）— 常驻，不可关</text><text x="700" y="108" font-size="12.5" font-weight="600" fill="#0B57D0" text-anchor="start" >右上</text><text x="800" y="108" font-size="12.5" font-weight="400" fill="#191C20" text-anchor="start" >保护锁 — 「保护与评分」开关</text><text x="700" y="132" font-size="12.5" font-weight="600" fill="#0B57D0" text-anchor="start" >右下</text><text x="800" y="132" font-size="12.5" font-weight="400" fill="#191C20" text-anchor="start" >选择框 — 常驻</text><text x="700" y="156" font-size="12.5" font-weight="600" fill="#0B57D0" text-anchor="start" >左下 · 下</text><text x="800" y="156" font-size="12.5" font-weight="400" fill="#191C20" text-anchor="start" >格式「J&amp;R / JPG / RAW / HEIF」— 「文件格式」开关</text><text x="700" y="180" font-size="12.5" font-weight="600" fill="#0B57D0" text-anchor="start" >左下 · 同胶囊</text><text x="800" y="180" font-size="12.5" font-weight="400" fill="#191C20" text-anchor="start" >文件大小「· 54.6 MB」— 「文件大小」开关；小号方块自动隐藏</text><text x="700" y="204" font-size="12.5" font-weight="600" fill="#0B57D0" text-anchor="start" >左下 · 上</text><text x="800" y="204" font-size="12.5" font-weight="400" fill="#191C20" text-anchor="start" >评分胶囊（星色 + 数字）— 「保护与评分」开关</text><text x="700" y="250" font-size="12" font-weight="400" fill="#42474E" text-anchor="start" >小号 91.5dp：格式胶囊 ≈ 30dp 宽，右下选择框 22dp，二者不相撞；</text><text x="700" y="270" font-size="12" font-weight="400" fill="#42474E" text-anchor="start" >中号 123dp：「J&amp;R · 54.6 MB」≈ 84dp + 选择框 22dp + 边距 &lt; 123dp；</text><text x="700" y="290" font-size="12" font-weight="400" fill="#42474E" text-anchor="start" >「Original」下载策略的 J&amp;R 显示 JPG+RAW 合计大小，JPG-only 显示 JPEG 大小。</text></svg>